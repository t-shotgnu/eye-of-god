<div class="field review-model-field" data-ai-discovery data-prefetch="review" data-provider="{{ settings.provider }}" data-demo="{{ 'true' if settings.demo and not sandbox else 'false' }}">
  <label for="review-model">Model for this review</label>
  <select id="review-model" name="review_model" data-review-model data-default-model="{{ settings.model }}">
    <option value="">Saved default · {{ settings.model or ('auto' if settings.provider == 'copilot' else 'not set') }}</option>
    <option value="__custom__">Enter a model ID…</option>
  </select>
  <div class="custom-model hidden" data-custom-model><label for="review-model-custom">Model ID</label><input id="review-model-custom" name="review_model_custom" maxlength="200" autocomplete="off" placeholder="Model ID for this review"></div>
  <small>Applies to this review only; your saved default stays unchanged.</small>
  <p class="provider-caption muted" data-ai-status role="status" aria-live="polite"></p>
  <button class="text-button" type="button" data-check-ai>Refresh available models</button>
</div>
